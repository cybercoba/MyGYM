<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Мій зал</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#101317;--card:#191e25;--card2:#222933;--line:#2b333e;--txt:#e9edf2;--mut:#8b96a5;--acc:#4f9cff;--acc2:#2f7be0;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5b84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;font-weight:700}
main{padding:12px 12px calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#151a20;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav{display:flex}
.mini{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:#1b2129}
.mini.hidden{display:none}
.mini .mname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;cursor:pointer;padding-left:6px}
.mini button{background:var(--card2);color:var(--txt);padding:7px 11px;font-size:15px}
body.has-mini main{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.mnow{font-weight:600;text-align:center;margin-bottom:8px;word-break:break-word}
#mseek{padding:0;margin:6px 0 2px;accent-color:var(--acc);background:none;border:0}
.mctl{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0 8px}
.mt{font-size:20px;padding:10px 12px;opacity:.55}.mt.sec{opacity:1}.mt.onc{opacity:1}
.mbig{font-size:26px;width:64px;height:64px;border-radius:50%;padding:0}
.list li.mcur{color:var(--acc)}
.chip.addc{color:var(--acc);border-style:dashed}
.sublist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 8px;color:var(--mut);font-weight:600}
.muted{color:var(--mut)}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--mut)}
label.block{margin:12px 0}
input,select,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;margin-top:4px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
input[type=date]{min-height:46px}
button{font:inherit;border-radius:10px;border:0;padding:11px 14px;cursor:pointer}
.pri{background:var(--acc2);color:#fff;font-weight:600}
.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.ghost{background:none;color:var(--mut)}
.danger{background:#3a1f22;color:var(--bad);border:1px solid #5a2a2e}
.big{width:100%;padding:14px;font-size:17px;margin:4px 0 12px}
.sm{padding:6px 10px;font-size:15px}
.w100{width:100%}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.exhead b{font-size:16px}
.sets{margin:10px 0}
.sethdr,.set{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:8px;align-items:center}
.sethdr{font-size:12px;color:var(--mut);margin-bottom:2px}
.sethdr span:nth-child(2),.sethdr span:nth-child(3){padding-left:4px}
.set{margin-bottom:6px}
.set input{margin:0;text-align:center;font-size:18px;padding:10px 6px}
.set .n{color:var(--mut);text-align:center;font-size:14px}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;background:none;color:var(--mut);padding:8px 4px;font-size:13px}
.seg button.on{background:var(--acc2);color:#fff}
canvas{width:100%;height:220px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:10px;padding:10px}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:var(--mut)}
.hist{cursor:pointer}
.hist .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px}
.list li:last-child{border-bottom:0}
.banner{background:#33290f;border:1px solid #5c4a1a;color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner button{margin-top:8px}
.up{color:var(--ok)}.down{color:var(--bad)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet.hidden{display:none}
.sheet .panel{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:82vh;display:flex;flex-direction:column}
.sheet .opts{overflow:auto;margin-top:8px}
.sheet .opt{display:block;width:100%;text-align:left;background:none;color:var(--txt);border-bottom:1px solid var(--line);border-radius:0;padding:13px 6px}
.sheet .opt.add{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b3542;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.eq{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;margin-top:8px;cursor:pointer}
.eq img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.eq .eqi{width:32px;text-align:center;font-size:18px}
.eqbtn{margin-top:6px;padding:6px 0;font-size:14px;color:var(--acc)}
.eqbig{width:100%;max-height:45vh;object-fit:contain;border-radius:12px;background:#000;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.gbar{display:grid;grid-template-columns:minmax(88px,max-content) 1fr 30px;gap:8px;align-items:center;padding:5px 0;cursor:pointer}
.gbar .gl{font-size:14px}.gbar b{text-align:right;font-size:14px}
.gbar .gt{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.gbar .gt i{display:block;height:100%;border-radius:99px}
.gex{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gex:last-child{border-bottom:0}
.gex .lvl{text-align:right;flex:none}.gex .lvl b{display:block;font-size:16px}.gex .lvl span{font-size:12px;color:var(--mut)}
.gtag{display:inline-block;background:var(--card2);border-radius:6px;padding:1px 7px;margin-right:4px;color:var(--txt)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style>
</head>
<body>
<header><h1 id="title">Тренування</h1></header>
<main id="view"></main>
<footer id="foot"><div id="mini" class="mini hidden"><span class="mname" data-act="gomusic"></span><button data-act="mprev" aria-label="Попередній">⏮</button><button data-act="mplay" aria-label="Грати/пауза">▶</button><button data-act="mnext" aria-label="Наступний">⏭</button></div>
<nav id="tabs">
  <button data-tab="workout" class="on"><span class="i">🏋️</span>Зал</button>
  <button data-tab="history"><span class="i">📅</span>Історія</button>
  <button data-tab="progress"><span class="i">📈</span>Прогрес</button>
  <button data-tab="weight"><span class="i">⚖️</span>Тіло</button>
  <button data-tab="music"><span class="i">🎵</span>Музика</button>
  <button data-tab="more"><span class="i">⚙️</span>Ще</button>
</nav></footer>
<audio id="audio" preload="auto"></audio>
<input type="file" id="musicFile" accept="audio/*" multiple hidden>
<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
<input type="file" id="camFile" accept="image/*" capture="environment" hidden>
<input type="file" id="galFile" accept="image/*" hidden>

<script>
(function(){
"use strict";
const KEY = 'miyzal.v1';
const DEFAULT_EX = ['Присідання зі штангою','Жим лежачи','Станова тяга','Румунська тяга','Жим стоячи (армійський)','Тяга штанги в нахилі','Підтягування','Віджимання на брусах','Тяга верхнього блоку','Тяга нижнього блоку сидячи','Жим гантелей на похилій лаві','Жим ногами','Випади з гантелями','Болгарські присідання','Розгинання ніг у тренажері','Згинання ніг у тренажері','Підйоми на носки','Махи гантелями в сторони','Тяга до обличчя (face pull)','Підйом штанги на біцепс','Молотки з гантелями','Французький жим','Розгинання рук на блоці','Планка','Скручування на блоці'];
const TITLES = {workout:'Тренування',history:'Історія',progress:'Прогрес',weight:'Вага і талія',music:'Музика',more:'Ще'};

let S, storageOk = true;
const ui = {tab:'workout', wid:null, pex:null, metric:'e1rm', pmode:'groups', pg:null, pickG:'all', pendingEx:null};

/* ---------- storage ---------- */
function load(){
  try { const t = localStorage.getItem(KEY); S = t ? JSON.parse(t) : null; }
  catch(e){ storageOk = false; S = null; }
  normalize();
}
function normalize(){
  if(!S || typeof S !== 'object') S = {};
  if(!Array.isArray(S.workouts)) S.workouts = [];
  if(!Array.isArray(S.weights)) S.weights = [];
  if(!Array.isArray(S.waists)) S.waists = [];
  if(!S.photos || typeof S.photos !== 'object') S.photos = {};
  if(!S.groups || typeof S.groups !== 'object') S.groups = {};
  if(!S.subs || typeof S.subs !== 'object') S.subs = JSON.parse(JSON.stringify(DEFAULT_SUBS));
  Object.keys(DEFAULT_SUBS).forEach(k => { if(!Array.isArray(S.subs[k])) S.subs[k] = DEFAULT_SUBS[k].slice(); });
  if(!Array.isArray(S.music)) S.music = [];
  if(!Array.isArray(S.exercises)) S.exercises = DEFAULT_EX.slice();
  if((S.defaultsV || 1) < 2){ NEW_DEFAULTS_V2.forEach(n => { if(!S.exercises.includes(n)) S.exercises.push(n); }); S.defaultsV = 2; }
  if(!Array.isArray(S.exercises)) S.exercises = DEFAULT_EX.slice();
  if(typeof S.goal !== 'number') S.goal = 85;
  if(!('lastBackup' in S)) S.lastBackup = null;
}
let saveT = null;
function save(now){
  clearTimeout(saveT);
  const go = () => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; return true; }
    catch(e){ storageOk = false; return false; }
  };
  if(now) return go(); saveT = setTimeout(go, 250); return true;
}
window.addEventListener('pagehide', () => save(true));
document.addEventListener('visibilitychange', () => { if(document.hidden) save(true); });

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const toTs = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d).getTime(); };
const fmtLong = s => new Date(toTs(s)).toLocaleDateString('uk-UA',{weekday:'short',day:'numeric',month:'long'});
const fmtShort = s => new Date(typeof s === 'number' ? s : toTs(s)).toLocaleDateString('uk-UA',{day:'numeric',month:'short'});
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtNum = v => { if(v == null) return '—'; const a = Math.abs(v); return a >= 1000 ? Math.round(v).toLocaleString('uk-UA') : String(Math.round(v*10)/10).replace('.', ','); };
const validSet = s => s && s.r > 0;
const fmtSet = s => (s.w ? fmtNum(s.w) + '×' : '') + (s.r || 0) + (s.w ? '' : ' повт.');
const e1rm = s => s.r === 1 ? s.w : s.w * (1 + s.r/30);
const sortedWorkouts = () => S.workouts.slice().sort((a,b) => a.date === b.date ? (a.created||0) - (b.created||0) : a.date < b.date ? -1 : 1);

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

function lastSession(name, cur){
  const ws = sortedWorkouts().reverse();
  for(const w of ws){
    if(cur && (w.id === cur.id || w.date > cur.date)) continue;
    const e = w.exercises.find(x => x.name === name);
    if(e && e.sets.some(validSet)) return {date:w.date, sets:e.sets.filter(validSet)};
  }
  return null;
}
function workoutVolume(w){ let v = 0; w.exercises.forEach(e => e.sets.forEach(s => { if(validSet(s)) v += (s.w||0) * s.r; })); return v; }
function usageOrder(){
  const last = {};
  sortedWorkouts().forEach(w => w.exercises.forEach(e => { last[e.name] = w.date + (w.created||0); }));
  return last;
}

/* ---------- render shell ---------- */
function render(){
  $('#title').textContent = TITLES[ui.tab];
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  let h = '';
  if(!storageOk) h += `<div class="banner">⚠️ Браузер не дозволяє зберігати дані. Записи можуть зникнути після закриття — зроби резервну копію у вкладці «Ще».</div>`;
  h += ({workout:vWorkout, history:vHistory, progress:vProgress, weight:vWeight, music:vMusic, more:vMore})[ui.tab]();
  $('#view').innerHTML = h;
  updateMini();
  if(ui.tab === 'music') musicAfterRender();
  if(ui.tab === 'progress') drawProgress();
  if(ui.tab === 'weight') drawWeight();
}

/* ---------- workout ---------- */
function vWorkout(){
  const w = S.workouts.find(x => x.id === ui.wid);
  return w ? vWorkoutEdit(w) : vWorkoutStart();
}
function vWorkoutStart(){
  const t = todayStr();
  const todayW = S.workouts.find(w => w.date === t);
  const sw = sortedWorkouts();
  const last = sw[sw.length-1];
  let h = '';
  const hasData = S.workouts.length || S.weights.length || S.waists.length;
  const days = S.lastBackup ? (Date.now() - S.lastBackup) / 864e5 : Infinity;
  if(hasData && days > 7) h += `<div class="banner">💾 ${S.lastBackup ? 'Остання резервна копія — ' + Math.floor(days) + ' дн. тому.' : 'Ти ще не робив резервну копію.'} Збережи, щоб не втратити записи.<br><button class="sec sm" data-act="export">Зберегти копію</button></div>`;

  if(todayW) h += `<button class="pri big" data-act="wopen" data-id="${todayW.id}">▶ Продовжити сьогоднішнє</button>`;
  h += `<section class="card"><h2>Нове тренування</h2>
    <label>Дата<input type="date" id="newDate" value="${t}" max="${t}"></label>
    <div class="row" style="margin-top:10px"><button class="pri grow" data-act="wnew">Почати порожнє</button></div>
    ${last ? `<div class="row" style="margin-top:8px"><button class="sec grow" data-act="wcopy" data-id="${last.id}">↻ Як минулого разу (${fmtShort(last.date)})</button></div>` : ''}
  </section>`;

  const weekAgo = toTs(t) - 6*864e5, monthStart = t.slice(0,8) + '01';
  const wk = S.workouts.filter(w => toTs(w.date) >= weekAgo).length;
  const mo = S.workouts.filter(w => w.date >= monthStart).length;
  h += `<section class="card"><div class="stats">
    <div class="stat"><b>${wk}</b><span>за 7 днів</span></div>
    <div class="stat"><b>${mo}</b><span>цього місяця</span></div>
    <div class="stat"><b>${S.workouts.length}</b><span>усього</span></div></div></section>`;

  if(last){
    h += `<h3>Останнє тренування</h3>` + histCard(last);
  } else {
    h += `<div class="empty">Тут з'являться твої тренування.<br>Натисни «Почати порожнє» і додай першу вправу.</div>`;
  }
  return h;
}
function vWorkoutEdit(w){
  let h = `<section class="card"><div class="row"><label class="grow">Дата<input type="date" data-in="wdate" value="${w.date}"></label></div>
    <div class="muted small" style="margin-top:8px">Усе зберігається автоматично.</div></section>`;
  if(!w.exercises.length) h += `<div class="empty">Додай першу вправу 👇</div>`;
  w.exercises.forEach((e,i) => {
    const prev = lastSession(e.name, w);
    h += `<section class="card"><div class="exhead"><b>${esc(e.name)}</b>
      <span>${i>0?`<button class="ghost sm" data-act="exup" data-i="${i}" aria-label="Вгору">↑</button>`:''}<button class="ghost sm" data-act="exdel" data-i="${i}" aria-label="Видалити">✕</button></span></div>
      <div class="muted small"><span class="gtag" data-act="gedit" data-n="${esc(e.name)}">${esc(gLabel(e.name))}</span> ${prev ? `Минулого разу (${fmtShort(prev.date)}): ${prev.sets.map(fmtSet).join(', ')}` : 'Вперше — запиши стартову точку'}</div>
      ${eqRow(e, i)}
      <div class="sets"><div class="sethdr"><span></span><span>кг</span><span>повтори</span><span></span></div>
      ${e.sets.map((s,j) => `<div class="set"><span class="n">${j+1}</span>
        <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="0" data-in="w" data-i="${i}" data-j="${j}" value="${s.w ?? ''}">
        <input type="number" inputmode="numeric" step="1" min="0" placeholder="0" data-in="r" data-i="${i}" data-j="${j}" value="${s.r ?? ''}">
        <button class="ghost sm" data-act="setdel" data-i="${i}" data-j="${j}" aria-label="Видалити підхід">−</button></div>`).join('')}
      </div><button class="sec w100" data-act="setadd" data-i="${i}">+ Підхід</button></section>`;
  });
  h += `<button class="pri big" data-act="exadd">+ Додати вправу</button>
    <section class="card"><label>Нотатка<textarea data-in="wnote" rows="2" placeholder="Самопочуття, сон, що змінити…">${esc(w.note||'')}</textarea></label>
    <div class="muted small" id="wsum" style="margin-top:8px">${sumText(w)}</div></section>
    <div class="row"><button class="sec grow" data-act="wclose">✓ Готово</button><button class="danger" data-act="wdel" data-id="${w.id}">Видалити</button></div>`;
  return h;
}
function sumText(w){
  const sets = w.exercises.reduce((a,e) => a + e.sets.filter(validSet).length, 0);
  return `Вправ: ${w.exercises.length} · підходів: ${sets} · тоннаж: ${fmtNum(workoutVolume(w))} кг`;
}
function newWorkout(date, from){
  const w = {id:uid(), date, created:Date.now(), note:'', exercises:[]};
  if(from) w.exercises = from.exercises.map(e => { const x = {name:e.name, sets:e.sets.filter(validSet).map(s => ({w:s.w, r:s.r}))}; if(e.eq) x.eq = {...e.eq}; return x; });
  w.exercises.forEach(e => { if(!e.sets.length) e.sets.push({w:null, r:null}); });
  S.workouts.push(w); save(true);
  ui.wid = w.id; render(); window.scrollTo(0,0);
}

/* ---------- history ---------- */
function histCard(w){
  const ex = w.exercises.map(e => {
    const best = e.sets.filter(validSet).sort((a,b) => (b.w||0) - (a.w||0))[0];
    return `<span class="pill">${esc(e.name)}${best ? ' · ' + fmtSet(best) : ''}</span>`;
  }).join('');
  return `<section class="card hist" data-act="wopen" data-id="${w.id}">
    <div class="top"><b>${fmtLong(w.date)}</b><span class="muted small">${fmtNum(workoutVolume(w))} кг</span></div>
    <div style="margin-top:6px">${ex || '<span class="muted small">порожнє</span>'}</div>
    ${w.note ? `<div class="muted small" style="margin-top:6px">📝 ${esc(w.note)}</div>` : ''}</section>`;

function vHistory(){
  const ws = sortedWorkouts().reverse();
  if(!ws.length) return `<div class="empty">Поки що порожньо. Перше тренування з'явиться тут.</div>`;
  let h = '', curM = '';
  ws.forEach(w => {

/* ---------- progress ---------- */
function exSessions(name){
  const out = [];
  sortedWorkouts().forEach(w => {
    const e = w.exercises.find(x => x.name === name); if(!e) return;
    const sets = e.sets.filter(validSet); if(!sets.length) return;
    const ws = sets.filter(s => s.w > 0);
    out.push({date:w.date, sets, eq:e.eq,
      maxW: ws.length ? Math.max(...ws.map(s => s.w)) : null,
      e1rm: ws.length ? Math.max(...ws.map(e1rm)) : null,
      vol: sets.reduce((a,s) => a + (s.w||0)*s.r, 0),
      reps: Math.max(...sets.map(s => s.r))});
  });
  return out;
}
function usedExercises(){
  const last = usageOrder();
  return Object.keys(last).filter(n => exSessions(n).length).sort((a,b) => last[b] > last[a] ? 1 : -1);
}
const METRICS = {e1rm:'1ПМ (оцінка)', maxW:'Макс. вага', vol:"Тоннаж", reps:'Макс. повтори'};
function vProgress(){
  const seg = `<div class="seg" style="margin-top:0"><button data-act="pmode" data-m="groups" class="${ui.pmode==='groups'?'on':''}">По групах м'язів</button><button data-act="pmode" data-m="ex" class="${ui.pmode==='ex'?'on':''}">По вправі</button></div>`;
  return seg + (ui.pmode === 'groups' ? vGroups() : vProgressEx());
}
function vProgressEx(){
  const ex = usedExercises();
  if(!ex.length) return `<div class="empty">Графіки з'являться, коли запишеш хоча б одне тренування з підходами.</div>`;
  if(!ui.pex || !ex.includes(ui.pex)) ui.pex = ex[0];
  const ss = exSessions(ui.pex);
  const bodyweight = ss.every(s => s.maxW == null);
  if(bodyweight && (ui.metric === 'e1rm' || ui.metric === 'maxW')) ui.metric = 'reps';
  let h = `<section class="card"><label>Вправа<select data-in="pex">${ex.map(n => `<option ${n===ui.pex?'selected':''}>${esc(n)}</option>`).join('')}</select></label>

  </section>`;
  const vals = ss.map(s => s[ui.metric]).filter(v => v != null);
  const first = vals[0], lastV = vals[vals.length-1], best = Math.max(...vals);
  const diff = lastV - first;

/* ---------- weight & waist ---------- */
function weightsSorted(){ return S.weights.slice().sort((a,b) => a.date < b.date ? -1 : 1); }
function waistsSorted(){ return S.waists.slice().sort((a,b) => a.date < b.date ? -1 : 1); }
function avg7(ws, i){ const t = toTs(ws[i].date); const sub = ws.filter((w,k) => k <= i && toTs(w.date) > t - 7*864e5); return sub.reduce((a,w) => a + w.kg, 0) / sub.length; }
function vWeight(){
  const t = todayStr();

  const tw = ws.find(w => w.date === t), tz = zs.find(z => z.date === t);
  let h = `<section class="card"><h2>Записати</h2><div class="row">
    <label class="grow">Вага, кг<input type="number" inputmode="decimal" step="0.1" min="20" id="wKg" placeholder="${ws.length ? fmtNum(ws[ws.length-1].kg) : '90'}" value="${tw ? tw.kg : ''}"></label>
    <label class="grow">Талія, см<input type="number" inputmode="decimal" step="0.5" min="40" id="wCm" placeholder="${zs.length ? fmtNum(zs[zs.length-1].cm) : '95'}" value="${tz ? tz.cm : ''}"></label></div>
    <label style="margin-top:8px">Дата<input type="date" id="wDate" value="${t}" max="${t}"></label>
    <button class="pri w100" style="margin-top:10px" data-act="wsave">Зберегти</button>
    <div class="muted small" style="margin-top:8px">Можна заповнити щось одне. Вагу — щодня зранку до їжі. Талію — раз на тиждень: на рівні пупка, на спокійному видиху, не втягуючи живіт.</div></section>`;
  if(ws.length){
    const cur = ws[ws.length-1].kg, a = avg7(ws, ws.length-1);
    const ch = cur - ws[0].kg, left = a - S.goal;
    let rate = null;
    if(ws.length >= 4){
      const i2 = ws.length-1; const prevIdx = ws.findIndex(w => toTs(w.date) >= toTs(ws[i2].date) - 14*864e5);
      const span = (toTs(ws[i2].date) - toTs(ws[prevIdx].date)) / (7*864e5);
      if(span >= 1) rate = (avg7(ws, i2) - avg7(ws, prevIdx)) / span;
    }
    h += `<h3>⚖️ Вага</h3><section class="card"><div class="stats">
      <div class="stat"><b>${fmtNum(a)}</b><span>сер. 7 днів</span></div>
      <div class="stat"><b class="${ch<0?'up':ch>0?'down':''}">${ch>0?'+':''}${fmtNum(ch)}</b><span>з початку</span></div>
      <div class="stat"><b>${left > 0 ? fmtNum(left) : '🎯'}</b><span>${left > 0 ? 'до цілі ' + fmtNum(S.goal) : 'ціль досягнута'}</span></div></div>
      ${rate != null ? `<div class="muted small" style="margin-top:10px">Темп за останні 2 тижні: <b style="color:var(--txt)">${rate>0?'+':''}${fmtNum(rate)} кг/тиж</b>${rate < -1 ? ' — швидкувато, можна з\'їсти трохи більше' : rate <= -0.2 ? ' — 👍 гарний темп' : rate < 0.1 ? ' — стоїть: спробуй мінус 100–200 ккал' : ''}${left > 0 && rate < -0.05 ? ` · до цілі ≈ ${Math.ceil(left / -rate)} тиж.` : ''}</div>` : ''}
      <canvas id="wchart" style="margin-top:10px"></canvas>
      <div class="muted small" style="margin-top:4px"><span style="color:#8b96a5">●</span> зважування <span style="color:#3ecf8e;margin-left:8px">━</span> середнє 7 днів <span style="color:#f5b84a;margin-left:8px">┅</span> ціль</div>
    </section>`;
  }
  if(zs.length){
    const zc = zs[zs.length-1].cm, zch = zc - zs[0].cm;
    h += `<h3>📏 Талія</h3><section class="card"><div class="stats">
      <div class="stat"><b>${fmtNum(zc)}</b><span>зараз, см</span></div>
      <div class="stat"><b class="${zch<0?'up':zch>0?'down':''}">${zch>0?'+':''}${fmtNum(zch)}</b><span>з початку</span></div>
      <div class="stat"><b>${zs.length}</b><span>замірів</span></div></div>
      <canvas id="zchart" style="margin-top:10px;height:180px"></canvas>
      <div class="muted small" style="margin-top:6px">Якщо вага стоїть, а талія зменшується — жир іде, а м'язи ростуть. Це і є рекомпозиція.</div>
    </section>`;
  }
  const dates = Array.from(new Set([...ws.map(w => w.date), ...zs.map(z => z.date)])).sort().reverse();
  if(dates.length){
    const wm = Object.fromEntries(ws.map(w => [w.date, w.kg])), zm = Object.fromEntries(zs.map(z => [z.date, z.cm]));
    h += `<h3>Записи</h3><section class="card"><ul class="list">

    </ul></section>`;
  }
  return h;
}
function drawWeight(){
  const cv = $('#wchart');
  if(cv){
    const ws = weightsSorted();
    chart(cv, [
      {points: ws.map(w => ({x:toTs(w.date), y:w.kg})), color:'#8b96a5', dots:true, line:false},
      {points: ws.map((w,i) => ({x:toTs(w.date), y:avg7(ws,i)})), color:'#3ecf8e', dots:false, line:true}

let eqDraft = null;
function lastEq(name, cur){
  const ws = sortedWorkouts().reverse();
  for(const w of ws){

    const e = w.exercises.find(x => x.name === name);

function eqRow(e, i){

function gcPhotos(){

  S.workouts.forEach(w => w.exercises.forEach(e => { if(e.eq && e.eq.photo) used.add(e.eq.photo); }));
  Object.keys(S.photos).forEach(k => { if(!used.has(k)) delete S.photos[k]; });
}
function openEq(i){

function renderEq(){

  const e = w.exercises[eqDraft.i];

    <label class="block">Опис<textarea id="eqNote" rows="3" placeholder="Напр.: синя гантель без цифр (≈12 кг), 3-тя зліва на стійці. Або: тренажер біля вікна, сидіння на 4">${esc(eqDraft.note)}</textarea></label>
    ${src ? `<img class="eqbig" src="${src}" alt="Фото снаряда">` : ''}
    <div class="row"><button class="sec grow" data-act="eqcam">📷 Камера</button><button class="sec grow" data-act="eqgal">🖼 Галерея</button>${src ? '<button class="danger" data-act="eqrm">Прибрати фото</button>' : ''}</div>
    <button class="pri w100" style="margin-top:12px" data-act="eqsave">Зберегти</button></div></div>`;
  sh.classList.remove('hidden');

function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const M = 720; let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, M / Math.max(w, h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function onPhotoPicked(input){
  const f = input.files && input.files[0]; input.value = '';
  if(!f || !eqDraft) return;
  const ta = $('#eqNote'); if(ta) eqDraft.note = ta.value;
  compressImage(f).then(d => { eqDraft.newData = d; renderEq(); }, () => toast('Не вдалося відкрити фото'));
}
function saveEq(){
  const w = S.workouts.find(x => x.id === ui.wid); if(!w || !eqDraft) return;
  const e = w.exercises[eqDraft.i];
  const old = e.eq ? {...e.eq} : null;
  const note = ($('#eqNote').value || '').trim();
  let pid = eqDraft.photo, newPid = null;
  if(eqDraft.newData){ newPid = pid = uid(); S.photos[pid] = eqDraft.newData; }
  if(note || pid) e.eq = {note, photo: pid || null}; else delete e.eq;
  gcPhotos();
  if(!save(true)){
    if(newPid) delete S.photos[newPid];
    if(old) e.eq = old; else delete e.eq;
    save(true);
    toast('Не вистачає пам\'яті для фото — збережи опис текстом');
    return;
  }
  closePicker(); render(); toast('Збережено');
}

function doExport(){
  S.lastBackup = Date.now(); save(true);
  const data = JSON.stringify({app:'miyzal', v:1, exported:new Date().toISOString(), data:S}, null, 1);
  try{
    const blob = new Blob([data], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'miy-zal-backup-' + todayStr() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Копію збережено в Завантаження');

function doImport(text){
  let obj;
  try { obj = JSON.parse(text); } catch(e){ alert('Не вдалося прочитати файл — це не схоже на резервну копію.'); return; }
  const d = obj && obj.data ? obj.data : obj;
  if(!d || !Array.isArray(d.workouts)){ alert('У файлі немає тренувань — перевір, що це копія з «Мій зал».'); return; }
  if(!confirm(`Відновити копію? Тренувань: ${d.workouts.length}, зважувань: ${(d.weights||[]).length}.\nПоточні дані на цьому пристрої буде замінено.`)) return;
  const keepMusic = S.music; S = d; normalize(); S.music = keepMusic; save(true); ui.wid = null; ui.tab = 'workout'; render(); toast('Дані відновлено');
}

/* ---------- music player (offline, IndexedDB) ---------- */
const audio = $('#audio');
const M = {idx:-1, url:null, shuffle:false, repeat:'all'};
let mdb = null;
function mdbOpen(){
  return new Promise((res, rej) => {
    if(mdb) return res(mdb);
    if(!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('miyzal-music', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tracks');
    r.onsuccess = () => { mdb = r.result; res(mdb); };
    r.onerror = () => rej(r.error);
  });
}
function mdbReq(mode, fn){
  return mdbOpen().then(db => new Promise((res, rej) => {
    const t = db.transaction('tracks', mode), rq = fn(t.objectStore('tracks')); let out;
    if(rq) rq.onsuccess = () => { out = rq.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
  }));
}
async function addTracks(files){
  let ok = 0, fail = 0, quota = false;
  toast('Додаю музику…');
  for(const f of files){
    try{
      const buf = await f.arrayBuffer();
      const blob = new Blob([buf], {type: f.type || 'audio/mpeg'});
      const id = uid();
      await mdbReq('readwrite', st => st.put(blob, id));
      S.music.push({id, name: f.name.replace(/\.[^.]+$/, ''), size: f.size});
      save(true); ok++;
      if(ui.tab === 'music') render();
    }catch(e){ fail++; if(e && /quota/i.test(e.name + e.message)){ quota = true; break; } }
  }
  toast(quota ? `Додано ${ok}. Закінчилось місце` : fail ? `Додано ${ok}, помилок: ${fail}` : `Додано треків: ${ok} 🎵`);
  if(ui.tab === 'music') render();
}
async function playIdx(i){
  if(i < 0 || i >= S.music.length) return;
  M.idx = i; const t = S.music[i];
  try{
    const blob = await mdbReq('readonly', st => st.get(t.id));
    if(!blob){ toast('Файл треку не знайдено'); return; }
    if(M.url) URL.revokeObjectURL(M.url);
    M.url = URL.createObjectURL(blob); audio.src = M.url;

  }catch(e){ if(!e || e.name !== 'AbortError') toast('Не вдалося відтворити цей файл'); }

}
function nextIdx(dir){

  if(j < 0 && dir < 0) j = n - 1;
  return j;
}
function mNext(){ const j = nextIdx(1); if(j >= 0) playIdx(j); }
function mPrev(){ if(audio.currentTime > 3){ audio.currentTime = 0; return; } const j = nextIdx(-1); if(j >= 0) playIdx(j); }
function mToggle(){

function openPicker(){
  const sh = $('#sheet');
  sh.innerHTML = `<div class="panel"><div class="row"><input class="grow" id="pq" placeholder="Пошук або нова вправа…" autocomplete="off" style="margin:0"><button class="ghost" data-act="pclose">Закрити</button></div><div class="chips" id="pchips"></div><div class="opts" id="popts"></div></div>`;
  sh.classList.remove('hidden');
  fillPicker('');
  const q = $('#pq'); q.addEventListener('input', () => fillPicker(q.value));
}
function fillPicker(q){
  const w = S.workouts.find(x => x.id === ui.wid);
  const inW = new Set(w ? w.exercises.map(e => e.name) : []);
  const last = usageOrder();
  const all = Array.from(new Set([...S.exercises, ...Object.keys(last)]));
  const qq = q.trim().toLowerCase();
  const g = ui.pickG;
  $('#pchips').innerHTML = [['all','Усі'], ...GROUPS].map(([k,v]) => `<button class="chip ${k===g?'on':''}" data-act="pickg" data-g="${k}">${v}</button>`).join('');
  let list = all.filter(n => (!qq || n.toLowerCase().includes(qq)) && (g === 'all' || groupOf(n) === g));
  list.sort((a,b) => (last[b]||'').localeCompare(last[a]||'') || a.localeCompare(b,'uk'));
  let h = '';
  if(qq && !all.some(n => n.toLowerCase() === qq)) h += `<button class="opt add" data-act="pick" data-n="${esc(q.trim())}">+ Нова вправа: «${esc(q.trim())}»${g !== 'all' ? ' → ' + GNAME[g] : ''}</button>`;
  h += list.map(n => `<button class="opt" data-act="pick" data-n="${esc(n)}">${esc(n)} <span class="muted small">· ${esc(gLabel(n))}${inW.has(n) ? ' · вже додано' : ''}</span></button>`).join('');
  $('#popts').innerHTML = h || '<div class="empty">Нічого не знайдено</div>';
}
function closePicker(){ eqDraft = null; const sh = $('#sheet'); sh.classList.add('hidden'); sh.innerHTML = ''; }

/* ---------- chart ---------- */
function chart(cv, series, o){
  o = o || {};
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 300, H = cv.clientHeight || 220;
  cv.width = W*dpr; cv.height = H*dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  const pts = series.flatMap(s => s.points);
  c.font = '12px system-ui,sans-serif';
  if(!pts.length){ c.fillStyle = '#8b96a5'; c.textAlign = 'center'; c.fillText('Поки немає даних', W/2, H/2); return; }
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  if(x0 === x1){ x0 -= 3*864e5; x1 += 3*864e5; }
  const ys = pts.map(p => p.y); if(o.goal != null) ys.push(o.goal);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pd = (y1 - y0) * 0.12 || Math.max(1, Math.abs(y1) * 0.05);
  y0 -= pd; y1 += pd;
  const L = 46, R = 12, T = 10, B = 24;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  c.strokeStyle = '#2b333e'; c.lineWidth = 1; c.fillStyle = '#8b96a5'; c.textAlign = 'right'; c.textBaseline = 'middle';
  for(let k = 0; k <= 4; k++){ const v = y0 + (y1 - y0) * k / 4, yy = Math.round(Y(v)) + .5; c.beginPath(); c.moveTo(L, yy); c.lineTo(W - R, yy); c.stroke(); c.fillText(fmtNum(v), L - 6, yy); }
  c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.fillText(fmtShort(x0), L, H - 6);
  c.textAlign = 'right'; c.fillText(fmtShort(x1), W - R, H - 6);
  if(o.goal != null){ c.save(); c.setLineDash([6,5]); c.strokeStyle = '#f5b84a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(L, Y(o.goal)); c.lineTo(W - R, Y(o.goal)); c.stroke(); c.restore(); }
  series.forEach(s => {
    const p = s.points; if(!p.length) return;
    if(s.line && p.length > 1){ c.strokeStyle = s.color; c.lineWidth = 2.5; c.lineJoin = 'round'; c.beginPath(); p.forEach((q,i) => i ? c.lineTo(X(q.x), Y(q.y)) : c.moveTo(X(q.x), Y(q.y))); c.stroke(); }
    if(s.dots || p.length === 1){ c.fillStyle = s.color; p.forEach(q => { c.beginPath(); c.arc(X(q.x), Y(q.y), p.length > 60 ? 2 : 3.5, 0, 7); c.fill(); }); }
  });
}

/* ---------- events ---------- */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if(!b) return;
  save(true);
  if(b.dataset.tab === 'workout' && ui.tab === 'workout') ui.wid = null;
  ui.tab = b.dataset.tab; render(); window.scrollTo(0,0);
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j;
  const w = S.workouts.find(x => x.id === ui.wid);
  switch(a){
    case 'wnew': { const d = ($('#newDate') && $('#newDate').value) || todayStr(); newWorkout(d); break; }
    case 'wcopy': { const src = S.workouts.find(x => x.id === b.dataset.id); const d = ($('#newDate') && $('#newDate').value) || todayStr(); newWorkout(d, src); toast('Скопійовано — онови цифри'); break; }
    case 'wopen': ui.wid = b.dataset.id; ui.tab = 'workout'; render(); window.scrollTo(0,0); break;
    case 'wclose':
      if(w && !w.exercises.length && !w.note){ S.workouts = S.workouts.filter(x => x.id !== w.id); gcPhotos(); }
      save(true); ui.wid = null; render(); window.scrollTo(0,0); toast('Збережено 💪'); break;
    case 'wdel': if(confirm('Видалити це тренування?')){ S.workouts = S.workouts.filter(x => x.id !== b.dataset.id); gcPhotos(); save(true); ui.wid = null; render(); } break;
    case 'exadd': openPicker(); break;
    case 'pclose': closePicker(); break;
    case 'pick': {
      const n = b.dataset.n; if(!w || !n) break;
      if(!allExercises().includes(n)){
        const gs = guessGroup(n);
        const g = ui.pickG !== 'all' ? ui.pickG : (gs ? gs.g : 'other');
        openGE(n, {thenAdd:true, g, sub: gs && gs.g === g ? gs.sub : null});
        break;
      }
      addToWorkout(n); break;
    }
    case 'gedit': openGE(b.dataset.n); break;
    case 'geg': geDraft.g = b.dataset.g; geDraft.sub = null; renderGE(); break;
    case 'ges': geDraft.sub = b.dataset.s || null; renderGE(); break;
    case 'gesnew': { const s2 = askSub(geDraft.g); if(s2) geDraft.sub = s2; renderGE(); break; }
    case 'gesave': {
      const d = geDraft; S.groups[d.n] = {g:d.g, sub:d.sub};
      if((d.isNewEx || d.thenAdd) && !S.exercises.includes(d.n)) S.exercises.push(d.n);
      save(true);
      if(d.thenAdd){ addToWorkout(d.n); } else { closePicker(); render(); toast('Збережено'); }
      break;
    }
    case 'subadd': { const s2 = askSub(b.dataset.g); if(s2){ render(); toast('Підгрупу додано'); } break; }
    case 'subdel': {
      const g = b.dataset.g, sb = b.dataset.s;
      if(!confirm(`Видалити підгрупу «${sb}»? Вправи з неї залишаться в групі «${GNAME[g]}» без підгрупи.`)) break;
      S.subs[g] = (S.subs[g] || []).filter(x => x !== sb);
      allExercises().forEach(n => { const i = groupInfo(n); if(i.g === g && i.sub === sb) S.groups[n] = {g, sub:null}; });
      save(true); render(); break;
    }
    case 'gomusic': ui.tab = 'music'; render(); window.scrollTo(0,0); break;
    case 'mplay': mToggle(); break;
    case 'mnext': mNext(); break;
    case 'mprev': mPrev(); break;
    case 'mpick': if(i === M.idx && audio.src) mToggle(); else playIdx(i); break;
    case 'mshuf': M.shuffle = !M.shuffle; render(); break;
    case 'mrep': M.repeat = M.repeat === 'all' ? 'one' : M.repeat === 'one' ? 'off' : 'all'; render(); break;
    case 'madd': $('#musicFile').click(); break;
    case 'mdel': {
      const t = S.music[i]; if(!t || !confirm(`Видалити «${t.name}» з застосунку?`)) break;
      mdbReq('readwrite', st => st.delete(t.id)).catch(() => {});
      S.music.splice(i, 1);
      if(i === M.idx){ audio.pause(); audio.removeAttribute('src'); audio.load(); if(M.url) URL.revokeObjectURL(M.url); M.url = null; M.idx = -1; }
      else if(i < M.idx) M.idx--;
      save(true); render(); break;
    }
    case 'exdel': if(w && confirm(`Прибрати «${w.exercises[i].name}» з тренування?`)){ w.exercises.splice(i,1); gcPhotos(); save(true); render(); } break;
    case 'exup': if(w && i > 0){ const t = w.exercises[i]; w.exercises[i] = w.exercises[i-1]; w.exercises[i-1] = t; save(true); render(); } break;
    case 'setadd': if(w){ const ss = w.exercises[i].sets, l = ss[ss.length-1]; ss.push(l ? {w:l.w, r:l.r} : {w:null, r:null}); save(true); render(); const inp = document.querySelector(`input[data-in="r"][data-i="${i}"][data-j="${ss.length-1}"]`); if(inp){ inp.focus(); inp.select && inp.select(); } } break;
    case 'setdel': if(w){ w.exercises[i].sets.splice(j,1); if(!w.exercises[i].sets.length) w.exercises[i].sets.push({w:null,r:null}); save(true); render(); } break;
    case 'metric': ui.metric = b.dataset.m; render(); break;
    case 'pmode': ui.pmode = b.dataset.m; render(); break;
    case 'pg': ui.pg = b.dataset.g; ui.pmode = 'groups'; render(); { const c = document.querySelector('.chips'); if(c) c.scrollIntoView({block:'start'}); } break;
    case 'gopen': ui.pex = b.dataset.n; ui.pmode = 'ex'; ui.metric = 'e1rm'; render(); window.scrollTo(0,0); break;
    case 'pickg': ui.pickG = b.dataset.g; fillPicker($('#pq').value); break;
    case 'wsave': {
      const kg = num($('#wKg').value), cm = num($('#wCm').value), d = $('#wDate').value || todayStr();
      const okKg = kg != null && kg >= 20 && kg <= 400, okCm = cm != null && cm >= 40 && cm <= 250;
      if(!okKg && !okCm){ toast('Введи вагу (кг) або талію (см)'); break; }
      if(okKg){ S.weights = S.weights.filter(x => x.date !== d); S.weights.push({date:d, kg}); }
      if(okCm){ S.waists = S.waists.filter(x => x.date !== d); S.waists.push({date:d, cm}); }
      save(true); render(); toast('Записано'); break;
    }
    case 'wtdel': if(confirm('Видалити записи за цей день?')){ S.weights = S.weights.filter(x => x.date !== b.dataset.d); S.waists = S.waists.filter(x => x.date !== b.dataset.d); save(true); render(); } break;
    case 'eqedit': openEq(i); break;
    case 'eqcam': $('#camFile').click(); break;
    case 'eqgal': $('#galFile').click(); break;
    case 'eqrm': { const ta = $('#eqNote'); if(ta) eqDraft.note = ta.value; eqDraft.photo = null; eqDraft.newData = null; renderEq(); break; }
    case 'eqsave': saveEq(); break;
    case 'export': doExport(); break;
    case 'import': $('#importFile').click(); break;
    case 'showtext': {
      S.lastBackup = Date.now(); save(true);
      $('#textBox').innerHTML = `<textarea id="bkText" rows="5" style="margin-top:10px;font-size:12px">${esc(JSON.stringify({app:'miyzal',v:1,data:S}))}</textarea>
        <div class="muted small" style="margin:6px 0">Виділи все й скопіюй, наприклад, собі в «Збережені» в Telegram. Щоб відновити — встав текст сюди й натисни «Відновити з тексту».</div>
        <div class="row"><button class="sec grow" data-act="copytext">Скопіювати</button><button class="sec grow" data-act="importtext">Відновити з тексту</button></div>`;
      break;
    }
    case 'copytext': { const t = $('#bkText'); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(_){} if(!ok && navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => toast('Скопійовано'), () => toast('Виділи текст і скопіюй вручну')); else toast(ok ? 'Скопійовано' : 'Виділи текст і скопіюй вручну'); break; }
    case 'importtext': doImport($('#bkText').value); break;
    case 'exnew': { const n = $('#newEx').value.trim(); if(n && !allExercises().includes(n)){ const gs = guessGroup(n); openGE(n, {isNewEx:true, g: gs ? gs.g : 'other', sub: gs ? gs.sub : null}); } break; }
    case 'exremove': S.exercises = S.exercises.filter(x => x !== b.dataset.n); save(true); render(); break;
    case 'wipe': if(confirm('Точно видалити ВСІ тренування, зважування, заміри і фото?') && confirm('Останнє попередження: це не можна скасувати. Видалити?')){ const keepMusic = S.music; S = null; normalize(); S.music = keepMusic; save(true); ui.wid = null; render(); toast('Усе видалено'); } break;
  }
});
$('#sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closePicker(); });

document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.in; if(!k) return;
  const w = S.workouts.find(x => x.id === ui.wid);
  if((k === 'w' || k === 'r') && w){
    const s = w.exercises[+el.dataset.i].sets[+el.dataset.j];
    const v = num(el.value); s[k] = v == null ? null : (k === 'r' ? Math.round(v) : v);
    const sum = $('#wsum'); if(sum) sum.textContent = sumText(w);
    save();
  } else if(k === 'wnote' && w){ w.note = el.value; save(); }
  else if(k === 'goal'){ const v = num(el.value); if(v && v > 20 && v < 400){ S.goal = v; save(); } }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.in;
  const w = S.workouts.find(x => x.id === ui.wid);
  if(k === 'wdate' && w && el.value){ w.date = el.value; save(true); render(); }
  if(k === 'pex'){ ui.pex = el.value; render(); }

});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(f); e.target.value = '';
});
$('#musicFile').addEventListener('change', e => { const fs = Array.from(e.target.files || []); e.target.value = ''; if(fs.length) addTracks(fs); });
document.addEventListener('input', e => { if(e.target.id === 'mseek'){ e.target._drag = true; audio.currentTime = +e.target.value; } });
document.addEventListener('change', e => { if(e.target.id === 'mseek') e.target._drag = false; });
$('#camFile').addEventListener('change', e => onPhotoPicked(e.target));
$('#galFile').addEventListener('change', e => onPhotoPicked(e.target));
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if(ui.tab === 'progress') drawProgress(); if(ui.tab === 'weight') drawWeight(); }, 150); });

load(); render();

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
// просимо браузер не чистити дані застосунку автоматично
try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(_){}
})();
</script>
